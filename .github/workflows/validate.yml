name: Valider

# Contrôle de chaque demande de fusion et de chaque branche de travail :
# cohérence du dépôt, marketplace.json synchronisé, tests des scripts.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Valider le dépôt
        run: python scripts/validate.py
      - name: Tests
        run: python -m unittest discover -s tests -v
